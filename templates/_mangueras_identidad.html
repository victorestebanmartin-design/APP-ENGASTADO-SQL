<dialog id="mp-identidad" class="mp-dialog" aria-labelledby="mp-identidad-titulo">
  <form id="mp-identidad-form">
    <h2 id="mp-identidad-titulo">Identificaci&oacute;n personal</h2>
    <label>Operario<select id="mp-operario" required><option value="">Seleccionar operario</option></select></label>
    <label>Clave personal<input id="mp-clave" type="password" autocomplete="current-password" required maxlength="128"></label>
    <p id="mp-identidad-error" role="alert"></p>
    <div class="mp-actions"><button type="button" id="mp-identidad-cancelar">Cancelar</button><button type="submit">Identificarse</button></div>
  </form>
</dialog>
