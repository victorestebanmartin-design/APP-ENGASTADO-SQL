<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% include '_head_pwa.html' %}
    <title>Identifícate — COJOsw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=13">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid rgba(148,163,184,.18);
            border-radius: 16px;
            padding: 42px 34px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 18px 50px rgba(0,0,0,.45);
            text-align: center;
        }
        .login-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.4em;
            letter-spacing: 2px;
            color: #f1f5f9;
            margin-bottom: 4px;
        }
        .login-logo .sw { color: #3b82f6; }
        .login-puesto {
            display: inline-block;
            background: rgba(59,130,246,.14);
            border: 1px solid rgba(59,130,246,.35);
            color: #93c5fd;
            border-radius: 999px;
            padding: 4px 14px;
            font-size: 0.82em;
            margin: 14px 0 24px;
        }
        .login-icon { font-size: 2.8em; line-height: 1; margin-bottom: 12px; }
        .login-msg { font-size: 1.08em; color: #cbd5e1; min-height: 1.4em; }
        .login-reasignar {
            display: inline-block;
            margin-top: 26px;
            color: #475569;
            text-decoration: none;
            font-size: 0.8em;
        }
        .login-reasignar:hover { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">COJO<span class="sw">sw</span></div>
        <div class="login-puesto">📍 {{ puesto_nombre or modulo_label }}</div>
        <div class="login-icon">📇</div>
        <div id="login-msg" class="login-msg">Pasa tu tarjeta por el lector...</div>

        <a href="#" class="login-reasignar" onclick="reasignarPuesto(); return false;">
            ¿Este equipo no es {{ puesto_nombre or modulo_label }}?
        </a>
        <br>
        <a href="{{ url_for('main.admin_pin') }}?next=/admin&amp;force=1" class="login-reasignar">🆘 SOS Admin (PIN)</a>
    </div>

    <script src="{{ url_for('static', filename='js/shared/rfid-login.js') }}"></script>
    <script>
        const PUESTO_ID = {{ puesto_id | tojson }};
        const MODULO = {{ modulo | tojson }};
        const MODULO_LABEL = {{ modulo_label | tojson }};
        const DESTINO = {{ destino | tojson }};

        // Un PC de engastado se identifica por su puesto; los de mangueras y
        // manguitos no tienen puesto, asi que sondean por modulo (es lo que
        // graba el lector RFID asignado a ese modulo -- ver operarios.py).
        const FILTRO_LOGINS = PUESTO_ID
            ? `puesto_id=${encodeURIComponent(PUESTO_ID)}`
            : `modulo=${encodeURIComponent(MODULO)}`;

        let _rfidEstadoSince = '';
        let _rfidEstadoTimer = null;
        let _rfidEstadoInicializado = false;

        let _limpiarMsgTimer = null;

        function _mensajeEspera() {
            const msg = document.getElementById('login-msg');
            msg.innerHTML = 'Pasa tu tarjeta por el lector...';
            msg.style.color = '#cbd5e1';
        }

        /**
         * Pinta el motivo por el que NO se ha podido entrar, con el consejo
         * de qué hacer. Antes un rechazo dejaba la pantalla igual que si no
         * hubieras pasado la tarjeta: no entrabas y no sabías por qué.
         */
        function mostrarMotivo(estado, motivo, consejo) {
            const msg = document.getElementById('login-msg');
            const rechazo = estado !== 'aviso';
            const icono = rechazo ? '🚫' : '⚠️';
            const color = rechazo ? '#f87171' : '#fbbf24';
            const texto = motivo || 'No se pudo procesar la tarjeta.';

            msg.innerHTML =
                `<div style="font-size:1.5em;line-height:1;margin-bottom:8px;">${icono}</div>` +
                `<div style="font-weight:600;">${texto}</div>` +
                (consejo
                    ? `<div style="font-size:.8em;color:#94a3b8;margin-top:10px;line-height:1.5;">${consejo}</div>`
                    : '') +
                `<div style="font-size:.75em;color:#64748b;margin-top:12px;">Puedes volver a pasar la tarjeta.</div>`;
            msg.style.color = color;

            // Estos mensajes hay que poder leerlos enteros: 12 s, y cualquier
            // aviso nuevo cancela la limpieza del anterior.
            if (_limpiarMsgTimer) clearTimeout(_limpiarMsgTimer);
            _limpiarMsgTimer = setTimeout(_mensajeEspera, 12000);
        }

        function _renderEstadoRfid(evento) {
            if (!evento || evento.estado === 'ok') return;
            mostrarMotivo(evento.estado, evento.motivo, evento.consejo);
        }

        function _iniciarSondeoEstadoRfid() {
            if (_rfidEstadoTimer) clearInterval(_rfidEstadoTimer);
            _rfidEstadoTimer = setInterval(async () => {
                try {
                    const q = new URLSearchParams();
                    if (PUESTO_ID) q.set('puesto_id', String(PUESTO_ID));
                    else if (MODULO) q.set('modulo', String(MODULO));
                    if (_rfidEstadoSince) q.set('since', _rfidEstadoSince);
                    const r = await fetch(`/api/rfid/entrada/estado?${q.toString()}`);
                    const d = await r.json();
                    const evs = (d && d.success && d.eventos) ? d.eventos : [];
                    if (!evs.length) return;

                    const ultimo = evs[evs.length - 1];
                    if (ultimo.ts) _rfidEstadoSince = ultimo.ts;

                    // Al abrir la pantalla solo se fija la base: lo que ya
                    // hubiera pasado antes no es asunto de esta sesión.
                    if (!_rfidEstadoInicializado) {
                        _rfidEstadoInicializado = true;
                        return;
                    }
                    // De todo lo nuevo interesa el último problema, no el
                    // último evento a secas (un 'ok' posterior lo taparía).
                    const problema = [...evs].reverse().find(e => e.estado !== 'ok');
                    if (problema) _renderEstadoRfid(problema);
                } catch (_) {
                    // Silencioso: si falla el sondeo, el login principal sigue activo.
                }
            }, 1500);
        }

        _iniciarSondeoEstadoRfid();

        iniciarDeteccionRfid(`/api/operarios/logins?${FILTRO_LOGINS}`, function (login) {
            const msg = document.getElementById('login-msg');
            msg.textContent = `✓ ${login.operario}`;
            msg.style.color = '#4ade80';

            fetch('/api/sesion/operario/adoptar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login_id: login.id })
            })
                .then(r => r.json())
                .then(d => {
                    if (!d.success) {
                        mostrarMotivo('rechazo',
                            d.error || 'No se pudo entrar.',
                            'Vuelve a pasar la tarjeta. Si sigue igual, avisa al administrador.');
                        return;
                    }
                    // Estar identificado no basta: el operario tiene que tener
                    // permitido el modulo de ESTE equipo (Admin -> Operarios).
                    if (d.permitido === false) {
                        mostrarMotivo('rechazo',
                            `${login.operario} no tiene permiso para ${MODULO_LABEL}`,
                            'Avisa al administrador para que te habilite el módulo ' +
                            '(Admin → Operarios → Módulos permitidos).');
                        fetch('/api/sesion/operario/salir', { method: 'POST' }).catch(() => {});
                        setTimeout(() => window.location.reload(), 12000);
                        return;
                    }
                    // Entrada directa al modulo de este PC
                    window.location.href = DESTINO || '/modules';
                })
                .catch(() => {
                    mostrarMotivo('rechazo', 'Error de conexión con el servidor.',
                        'Comprueba la red y vuelve a pasar la tarjeta.');
                });
        });

        // Reasignación: exige PIN de admin (ver /api/puesto/pc/reasignar).
        // Aquí solo se manda a la pantalla del selector; si el PC ya tiene
        // puesto, el propio selector es quien pide el PIN al confirmar.
        function reasignarPuesto() {
            window.location.href = '/puesto/seleccionar';
        }
    </script>
</body>
</html>
