<?xml version="1.0" encoding="utf-8"?>
<!-- Esquema del ESP32 del CARRO — página A4 para imprimir -->
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <style>
    .title { font: bold 12px Arial; }
    .label { font: 10px Arial; }
    .small { font: 8px Arial; }
    .box { fill: #f6f6f6; stroke: #222; stroke-width: 0.6; }
    .wire { stroke: #000; stroke-width: 0.8; fill: none; }
    .gnd { stroke: #000; stroke-width: 0.8; }
    .note { font: 8px Arial; fill: #111; }
  </style>

  <!-- Header -->
  <text x="10" y="14" class="title">Esquema Eléctrico: ESP32 (Carro)</text>
  <text x="10" y="22" class="small">Una página A4 para montaje — conexiones físicas y notas de montaje</text>

  <!-- PowerBank -->
  <rect x="10" y="30" width="38" height="22" class="box"/>
  <text x="12" y="44" class="label">Power Bank</text>
  <text x="12" y="52" class="small">USB-A 5V</text>
  <!-- VBUS wire to switch -->
  <line x1="48" y1="41" x2="76" y2="41" class="wire" />
  <text x="50" y="36" class="small">VBUS 5V</text>

  <!-- Switch on VBUS -->
  <rect x="76" y="34" width="18" height="14" rx="2" class="box"/>
  <text x="80" y="44" class="small">INTERRUPTOR</text>
  <line x1="94" y1="41" x2="118" y2="41" class="wire" />

  <!-- USB-C connector (to Display) -->
  <rect x="118" y="32" width="28" height="18" class="box"/>
  <text x="120" y="44" class="small">USB-C -> Display</text>

  <!-- gen4-ESP32-24: la pantalla va integrada de fábrica, no se cablea; solo
       importa el breakout FFC de 30 pines para el resto del montaje. -->
  <rect x="10" y="70" width="188" height="90" class="box"/>
  <text x="12" y="84" class="label">4D Systems gen4-ESP32-24 — Breakout FFC (pins 1..30)</text>
  <text x="12" y="96" class="small">Pantalla integrada de fábrica: no lleva cableado propio</text>

  <!-- Annotate important pads (right column) -->
  <g transform="translate(142,92)">
    <text x="2" y="0" class="small">Pad 1: GND</text>
    <text x="2" y="10" class="small">Pad 2: GPIO17 → BTN1</text>
    <text x="2" y="20" class="small">Pad 3: GPIO18 → BUZZER</text>
    <text x="2" y="30" class="small">Pad 4: GPIO16 → BTN2</text>
    <text x="2" y="40" class="small">Pad 5: GPIO15 → BTN3</text>
    <text x="2" y="50" class="small">Pad 6: GPIO48 → BTN4</text>
    <text x="2" y="60" class="small">Pad 7: GPIO47 → BTN5</text>
    <text x="2" y="70" class="small">Pad 8: GPIO38 → BTN6</text>
    <text x="2" y="80" class="small">Pad 9: GPIO39 → BTN7</text>
    <text x="2" y="90" class="small">Pad 10: GPIO40 → BTN8 (OK)</text>
  </g>

  <!-- Wires from breakout to buttons -->
  <!-- Draw buttons area -->
  <rect x="10" y="170" width="90" height="110" class="box"/>
  <text x="14" y="184" class="label">Panel de botones (carro)</text>
  <g class="small">
    <!-- Buttons listed -->
    <text x="16" y="200">BTN1 ← Pad2 (GPIO17)</text>
    <text x="16" y="214">BTN2 ← Pad4 (GPIO16)</text>
    <text x="16" y="228">BTN3 ← Pad5 (GPIO15)</text>
    <text x="16" y="242">BTN4 ← Pad6 (GPIO48)</text>
    <text x="16" y="256">BTN5 ← Pad7 (GPIO47)</text>
    <text x="16" y="270">BTN6 ← Pad8 (GPIO38)</text>
    <text x="16" y="284">BTN7 ← Pad9 (GPIO39)</text>
    <text x="16" y="298">BTN8 (OK) ← Pad10 (GPIO40)</text>
  </g>

  <!-- GND bus -->
  <line x1="34" y1="170" x2="34" y2="285" stroke="#000" stroke-width="1" />
  <text x="36" y="180" class="small">GND común (pad1,21,25,30)</text>

  <!-- PN532 NFC module block -->
  <rect x="110" y="170" width="88" height="52" class="box"/>
  <text x="115" y="186" class="label">Módulo PN532 (I2C)</text>
  <text x="115" y="198" class="small">SDA → Pad11 (GPIO6)</text>
  <text x="115" y="210" class="small">SCL → Pad12 (GPIO5)</text>
  <text x="115" y="222" class="small">VCC → 3.3V (Pad20) o 5V</text>
  <text x="115" y="234" class="small">GND → GND</text>
  <text x="115" y="246" class="small">REQ: 100µF + 100nF cerca del módulo</text>

  <!-- Buzzer block -->
  <rect x="110" y="226" width="88" height="36" class="box"/>
  <text x="115" y="244" class="small">BUZZER → Pad3 (GPIO18)</text>
  <text x="115" y="256" class="small">Activo: directo a GPIO18/GND</text>
  <text x="115" y="268" class="small">Pasivo: usar NPN + base 4.7kΩ + diodo opc.</text>

  <!-- 3.3V output pad note -->
  <text x="10" y="294" class="note">Notas: Interruptor en VBUS (no EN-RST). Si PN532 reinicia, alimentar desde 5V o añadir condensadores. Ver `esp32/HARDWARE.md`.</text>

  <!-- Bottom right: materiales recomendados -->
  <rect x="10" y="290" width="190" height="-80" fill-opacity="0" stroke="none"/>
  <g transform="translate(10,200)">
    <text x="0" y="110" class="small">Material recomendado:</text>
    <text x="0" y="122" class="small">- Condensador 100µF electrolítico + 100nF cerámico en PN532</text>
    <text x="0" y="134" class="small">- 100nF en paralelo a cada pulsador (antirrebote)</text>
    <text x="0" y="146" class="small">- Resistencias 4.7–10kΩ pull-up opcionales en pulsadores</text>
    <text x="0" y="158" class="small">- Interruptor en el cable VBUS USB-C; cortar 5V</text>
    <text x="0" y="170" class="small">- Diagrama para montaje: usar cable trenzado y masa acompañando señales</text>
  </g>

  <!-- Footer: archivo y versión -->
  <text x="10" y="286" class="small">Archivo: esp32/schematics/carro_esquema.svg</text>
</svg>
