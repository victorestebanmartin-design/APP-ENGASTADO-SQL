        <text x="700" y="510" class="lbl-s">pistas_A4.html</text>
        <rect x="612" y="530" width="180" height="280" class="box-bg"/>
        <text x="702" y="550" class="lbl-box" text-anchor="middle">SALIDAS</text>
        <text x="702" y="564" class="lbl-box" text-anchor="middle">(C14…C20)</text>
        <g class="lbl-s">
          <text x="622" y="588" class="lbl-warn-b">J2 · 3 vías  → tira WS2813</text>
          <text x="630" y="602">+5V · DATA · GND</text>
          <text x="630" y="616">puentear DIN y BI en la tira</text>
          <text x="622" y="638" class="lbl-warn-b">J3 · 2 vías  ← cola de la tira</text>
          <text x="630" y="652">DATA_RET (DO del LED 16) · GND</text>
          <text x="622" y="674" class="lbl-bus">J4 · 6 vías  → placa siguiente</text>
          <text x="630" y="688">3V3 · GND · DATA_RET · SCL · SDA · 5V</text>
          <text x="630" y="702" class="lbl-warn-b">mismo orden que J1: cable recto</text>
          <text x="622" y="724">R3  330 Ω en serie con DATA de J2</text>
          <text x="622" y="746">JP1  puente de hilo en el camino</text>
          <text x="622" y="760">de datos: quitarlo deja intercalar</text>
          <text x="622" y="778">un 74AHCT125 EXTERNO (no cabe aquí).</text>
          <text x="622" y="792">El WS2813 quiere 3,5 V y el ESP32 da</text>
          <text x="622" y="806">3,3: si el 1er LED hace colores raros.</text>
        </g>

        <text x="500" y="840" class="lbl-s" text-anchor="middle">F1 ← 14 filas → F14 · El DIP-28 ocupa las 14 filas justas: por eso los 16 canales quedan enfrentados a los laterales y los hilos van rectos</text>

        <!-- ══ §3 DIRECCIONES ══ -->
        <line x1="30" y1="858" x2="970" y2="858" stroke="#cbd5e1" stroke-width="1"/>
        <text x="30" y="884" class="sec-header">3 · Dirección I2C: los straps A0 / A1 / A2 (pines 15, 16, 17) — a GND o a +3,3 V, nunca al aire</text>

        <g>
          <rect x="30" y="898" width="940" height="22" fill="#0f172a"/>
          <text x="95"  y="913" class="lbl-b" fill="#ffffff" text-anchor="middle">PLACA</text>
          <text x="230" y="913" class="lbl-b" fill="#ffffff" text-anchor="middle">GAVETAS</text>
          <text x="360" y="913" class="lbl-b" fill="#ffffff" text-anchor="middle">DIRECCIÓN</text>
          <text x="490" y="913" class="lbl-b" fill="#ffffff" text-anchor="middle">A2 (17)</text>
          <text x="620" y="913" class="lbl-b" fill="#ffffff" text-anchor="middle">A1 (16)</text>
          <text x="750" y="913" class="lbl-b" fill="#ffffff" text-anchor="middle">A0 (15)</text>
          <text x="880" y="913" class="lbl-b" fill="#ffffff" text-anchor="middle">PULL-UPS</text>
        </g>
        <g class="lbl">
          <rect x="30" y="920" width="940" height="22" fill="#eff6ff" stroke="#cbd5e1"/>
          <text x="95"  y="935" text-anchor="middle" font-weight="bold">MASTER</text>
          <text x="230" y="935" text-anchor="middle">1 – 16</text>
          <text x="360" y="935" text-anchor="middle" font-weight="bold">0x20</text>
          <text x="490" y="935" text-anchor="middle">GND</text>
          <text x="620" y="935" text-anchor="middle">GND</text>
          <text x="750" y="935" text-anchor="middle">GND</text>
          <text x="880" y="935" text-anchor="middle" font-weight="bold" fill="#b91c1c">SÍ (4k7)</text>

          <rect x="30" y="942" width="940" height="20" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="95"  y="956" text-anchor="middle">ESCLAVA 1</text>
          <text x="230" y="956" text-anchor="middle">17 – 32</text>
          <text x="360" y="956" text-anchor="middle" font-weight="bold">0x21</text>
          <text x="490" y="956" text-anchor="middle">GND</text>
          <text x="620" y="956" text-anchor="middle">GND</text>
          <text x="750" y="956" text-anchor="middle" fill="#dc2626" font-weight="bold">+3,3 V</text>
          <text x="880" y="956" text-anchor="middle">no</text>

          <rect x="30" y="962" width="940" height="20" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="95"  y="976" text-anchor="middle">ESCLAVA 2</text>
          <text x="230" y="976" text-anchor="middle">33 – 48</text>
          <text x="360" y="976" text-anchor="middle" font-weight="bold">0x22</text>
          <text x="490" y="976" text-anchor="middle">GND</text>
          <text x="620" y="976" text-anchor="middle" fill="#dc2626" font-weight="bold">+3,3 V</text>
          <text x="750" y="976" text-anchor="middle">GND</text>
          <text x="880" y="976" text-anchor="middle">no</text>

          <rect x="30" y="982" width="940" height="20" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="95"  y="996" text-anchor="middle">ESCLAVA 3</text>
          <text x="230" y="996" text-anchor="middle">49 – 64</text>
          <text x="360" y="996" text-anchor="middle" font-weight="bold">0x23</text>
          <text x="490" y="996" text-anchor="middle">GND</text>
          <text x="620" y="996" text-anchor="middle" fill="#dc2626" font-weight="bold">+3,3 V</text>
          <text x="750" y="996" text-anchor="middle" fill="#dc2626" font-weight="bold">+3,3 V</text>
          <text x="880" y="996" text-anchor="middle">no</text>

          <rect x="30" y="1002" width="940" height="20" fill="#f8fafc" stroke="#cbd5e1"/>
          <text x="95"  y="1016" text-anchor="middle">ESCLAVA 4 … 7</text>
          <text x="230" y="1016" text-anchor="middle">65 – 128</text>
          <text x="360" y="1016" text-anchor="middle" font-weight="bold">0x24 … 0x27</text>
          <text x="620" y="1016" text-anchor="middle" class="lbl-s">A2 = +3,3 V, y A1/A0 siguiendo el binario (100, 101, 110, 111)</text>
          <text x="880" y="1016" text-anchor="middle">no</text>
        </g>
        <text x="30" y="1040" class="lbl-s">El firmware ordena los expansores de menor a mayor dirección: el strap ES la numeración de las gavetas del puesto. Dos placas con el mismo strap se ven como una sola.</text>
        <text x="30" y="1056" class="lbl-s">RESET (pin 18) SIEMPRE a +3,3 V. Flotando, el chip se reinicia solo y el puesto pierde gavetas al azar. INTA e INTB se dejan al aire: el firmware sondea, no usa interrupciones.</text>

        <!-- ══ §4 AVISOS ══ -->
        <line x1="30" y1="1074" x2="970" y2="1074" stroke="#cbd5e1" stroke-width="1"/>
        <text x="30" y="1100" class="sec-header">4 · Lo que no se puede hacer mal</text>

        <rect x="30" y="1112" width="300" height="150" class="box-warn"/>
        <text x="44" y="1132" class="lbl-warn-b">⚠ El MCP23017 va a 3,3 V. NUNCA a 5 V.</text>
        <text x="44" y="1150" class="lbl-warn">A 5 V sus líneas SDA/SCL suben a 5 V y</text>
        <text x="44" y="1165" class="lbl-warn">se llevan por delante los GPIO del</text>
        <text x="44" y="1180" class="lbl-warn">ESP32-S3, de forma permanente.</text>
        <text x="44" y="1203" class="lbl-warn-b">⚠ Nunca USB-C y los 5 V del DB9 a la vez.</text>
        <text x="44" y="1221" class="lbl-warn">Antes de dar tensión, comprueba en el</text>
        <text x="44" y="1236" class="lbl-warn">zócalo vacío: pin 9 = 3,30 V, pin 10 = 0 V.</text>
        <text x="44" y="1251" class="lbl-warn">Si el pin 9 marca 5 V, para ahí.</text>

        <rect x="345" y="1112" width="300" height="150" class="box-warn"/>
        <text x="359" y="1132" class="lbl-warn-b">⚠ El lateral derecho va INVERTIDO.</text>
        <text x="359" y="1150" class="lbl-warn">R1 = gaveta 16 … R8 = gaveta 9. No es</text>
        <text x="359" y="1165" class="lbl-warn">errata: el MCP numera GPB de abajo</text>
        <text x="359" y="1180" class="lbl-warn">arriba y así los 8 hilos van rectos.</text>
        <text x="359" y="1203" class="lbl-warn-b">ROTULA LA PLACA.</text>
        <text x="359" y="1221" class="lbl-warn">A los seis meses nadie se acuerda, y el</text>
        <text x="359" y="1236" class="lbl-warn">síntoma —enciende la 9 y suena la 16—</text>
        <text x="359" y="1251" class="lbl-warn">parece un fallo de software.</text>

        <rect x="660" y="1112" width="310" height="150" class="box-warn"/>
        <text x="674" y="1132" class="lbl-warn-b">⚠ Una sola masa, y está en la MASTER.</text>
        <text x="674" y="1150" class="lbl-warn">El GND de la fuente, el del DB9 y el</text>
        <text x="674" y="1165" class="lbl-warn">retorno de los micros se juntan aquí y en</text>
        <text x="674" y="1180" class="lbl-warn">ningún otro sitio. Sin masa común los</text>
        <text x="674" y="1195" class="lbl-warn">datos no tienen contra qué medirse.</text>
        <text x="674" y="1218" class="lbl-warn-b">⚠ Más de 3 placas: 5 V directos a cada J0.</text>
        <text x="674" y="1236" class="lbl-warn">32 LEDs a tope son ~2 A y hoy pasan todos</text>
        <text x="674" y="1251" class="lbl-warn">por la MASTER. La cadena de datos sigue igual.</text>

        <rect x="30" y="1275" width="940" height="62" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="6"/>
        <text x="44" y="1295" class="lbl-b">Comprobación final, en este orden:</text>
        <text x="44" y="1313" class="lbl">1. Polímetro con el zócalo vacío  →  2. MCP puesto, muesca arriba  →  3. Reiniciar el lector: la pantalla de reposo debe poner <tspan font-weight="bold">PTL 1xMCP 16GAV</tspan> (o 2xMCP 32GAV)</text>
        <text x="44" y="1330" class="lbl">4. Admin → Lectores RFID → probar cableado, LED a LED y micro a micro  →  5. Coger la gaveta buena: dos toques cortos <tspan font-weight="bold">ascendentes</tspan>. Grave y machacón = otra gaveta.</text>
